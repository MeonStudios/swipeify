name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The "Run workflow" button: checks and deploys the chosen branch (use main).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Publishes to https://meonstudios.github.io/swipeify/ after the checks pass.
  # Needs Settings → Pages → Source set to "GitHub Actions" and the repository
  # variable VITE_SPOTIFY_CLIENT_ID (see README → Deploying to GitHub Pages).
  # Build and deploy are separate jobs: deploy-pages can miss an artifact
  # uploaded moments earlier in the same job (actions/deploy-pages#451).
  pages-build:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Check the Spotify client ID is set
        if: vars.VITE_SPOTIFY_CLIENT_ID == ''
        run: |
          echo "::error::Add the repository variable VITE_SPOTIFY_CLIENT_ID (Settings → Secrets and variables → Actions → Variables)."
          exit 1
      - run: npm run build
        env:
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
